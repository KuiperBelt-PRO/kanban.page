[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuiper-kanban-mcp"
version = "0.1.0"
description = "MCP FastMCP kuiper-kanban (tablero local vía CLI kanban)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kuiper_kanban*", "kuiper_kanban_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
